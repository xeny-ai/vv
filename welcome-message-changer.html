<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome Message Changer</title>
<style>
:root {
  --bg: #F1F3EF; --surface: #FFFFFF; --fg: #14201C; --muted: #5B6A64; --line: #D9DFDA;
  --accent: #1B6B58; --accent-fg: #FFFFFF; --ok: #1B6B58; --err: #A33A2A; --bubble: #E8ECE8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E1512; --surface: #16201C; --fg: #E6EEE9; --muted: #93A39B; --line: #2A3832;
    --accent: #5FC9A9; --accent-fg: #07130F; --ok: #5FC9A9; --err: #F08A77; --bubble: #223029; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif; padding: 24px 16px 48px; }
main { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-size: 28px; line-height: 1.15; margin: 0; }
.lede { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 6px; }
input, textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
textarea { min-height: 140px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; font-weight: 600; border-radius: 12px; padding: 13px 16px; min-height: 48px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
.status { font-size: 14px; min-height: 21px; color: var(--muted); overflow-wrap: anywhere; }
.status.ok { color: var(--ok); } .status.err { color: var(--err); }
.live { display: none; gap: 6px; }
.live.show { display: grid; }
.live span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bubble { background: var(--bubble); border-radius: 4px 14px 14px 14px; padding: 10px 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
@media (max-width: 380px) { .btns { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Welcome message</h1>
    <p class="lede">Change the first thing your ElevenLabs agent says. Only <code>first_message</code> is sent; the system prompt is untouched.</p>
  </header>

  <section class="card">
    <div>
      <label for="key">ElevenLabs API key</label>
      <input id="key" type="password" autocomplete="off" placeholder="Paste your new key (not stored)">
      <p class="hint">Kept in this tab only. Use the rotated key, not the one pasted in chat.</p>
    </div>
    <div>
      <label for="agent">Agent ID</label>
      <input id="agent" type="text" autocomplete="off" value="agent_0701m6deh9mhe6mrx8m95znbs03f">
    </div>
    <div>
      <label for="msg">Welcome message</label>
      <textarea id="msg" placeholder="Type the new welcome message"></textarea>
    </div>
    <div class="btns">
      <button id="load" type="button">Load current</button>
      <button id="save" type="button" class="primary">Save</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card live" id="live">
    <span>Live on ElevenLabs now</span>
    <div class="bubble" id="liveText"></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var keyEl = $("key"), agentEl = $("agent"), msgEl = $("msg");
  var loadBtn = $("load"), saveBtn = $("save"), statusEl = $("status");
  var liveBox = $("live"), liveText = $("liveText");

  function setStatus(t, k) { statusEl.textContent = t; statusEl.className = "status" + (k ? " " + k : ""); }
  function busy(b) { loadBtn.disabled = b; saveBtn.disabled = b; }

  function url() { return "https://api.elevenlabs.io/v1/convai/agents/" + encodeURIComponent(agentEl.value.trim()); }

  function call(method, body) {
    var opts = { method: method, headers: { "xi-api-key": keyEl.value.trim() } };
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(url(), opts).then(function (r) {
      return r.text().then(function (t) {
        if (!r.ok) throw new Error("ElevenLabs returned " + r.status + ". " + t.slice(0, 200));
        return t ? JSON.parse(t) : {};
      });
    });
  }

  function current(data) {
    return ((data.conversation_config || {}).agent || {}).first_message || "";
  }

  function check() {
    if (!keyEl.value.trim() || !agentEl.value.trim()) { setStatus("Enter the API key and agent ID first.", "err"); return false; }
    return true;
  }

  loadBtn.addEventListener("click", function () {
    if (!check()) return;
    busy(true); setStatus("Loading current message…");
    call("GET").then(function (d) {
      msgEl.value = current(d);
      liveText.textContent = current(d) || "(empty)"; liveBox.classList.add("show");
      setStatus("Loaded the current message.", "ok");
    }).catch(function (e) { setStatus(e.message, "err"); }).then(function () { busy(false); });
  });

  saveBtn.addEventListener("click", function () {
    if (!check()) return;
    var text = msgEl.value.trim();
    if (!text) { setStatus("Type a welcome message first.", "err"); return; }
    busy(true); setStatus("Saving…");
    call("PATCH", { conversation_config: { agent: { first_message: text } } })
      .then(function () { return call("GET"); })
      .then(function (d) {
        var live = current(d);
        liveText.textContent = live || "(empty)"; liveBox.classList.add("show");
        if (live === text) {
          setStatus("Saved and confirmed at " + new Date().toLocaleTimeString() + ". Refresh the ElevenLabs dashboard to see it.", "ok");
        } else {
          setStatus("Saved, but the live message differs. A language preset may be overriding it.", "err");
        }
      })
      .catch(function (e) {
        setStatus(e.message + (e instanceof TypeError ? " Network or browser block. Check your connection." : ""), "err");
      })
      .then(function () { busy(false); });
  });
})();
</script>
</body>
</html>
